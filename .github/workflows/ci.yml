name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Check data pipeline imports
      run: |
        python -c "from data_pipeline import clean_data, feature_engineering; print('Pipeline imports OK')"
    - name: Check API imports
      run: |
        python -c "from api import app; print('API imports OK')"
